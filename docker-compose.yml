# One command:   docker compose up
# Then open      http://localhost:8000   (login: admin / uninet)
#
# Override auth with UNINET_AUTH_USER / UNINET_AUTH_PASSWORD / UNINET_SECRET_KEY.
services:
  uninet:
    build: .
    image: uninet:latest
    ports:
      - "8000:8000"
    environment:
      UNINET_API_HOST: "0.0.0.0"
      UNINET_API_PORT: "8000"
      UNINET_AUTH_USER: "${UNINET_AUTH_USER:-admin}"
      UNINET_AUTH_PASSWORD: "${UNINET_AUTH_PASSWORD:-uninet}"
      UNINET_SECRET_KEY: "${UNINET_SECRET_KEY:-uninet-dev-secret-change-me}"
    # Persist the trained anomaly model between runs.
    volumes:
      - uninet-models:/app/models

  # Optional: Kafka one-way bus. Enable with:  docker compose --profile kafka up
  kafka:
    profiles: ["kafka"]
