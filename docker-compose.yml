# Optional infrastructure for the streaming demo. Not required for `make demo`
# (the default in-process bus needs nothing). Bring this up only to exercise the
# Kafka one-way transport:  docker compose up -d  &&  UNINET_BUS=kafka make serve
services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  api:
    build: .
    command: python -m uninet.demo --serve --no-open
    ports:
      - "8000:8000"
    environment:
      UNINET_BUS: kafka
      UNINET_KAFKA_BROKERS: kafka:9092
      UNINET_API_HOST: 0.0.0.0
    depends_on:
      - kafka
